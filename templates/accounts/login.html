{% extends 'base.html' %}
{% block title %}Login | SmartRecruit AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-1"><i class="fa-solid fa-right-to-bracket text-primary"></i> Login</h4>
                    <p class="text-muted mb-4">Welcome back to SmartRecruit AI</p>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        {% if form.errors %}
                            <div class="alert alert-danger">Invalid username or password.</div>
                        {% endif %}

                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>

                    <p class="text-center mt-3 text-muted small">
                        Don't have an account? <a href="{% url 'accounts:register_choice' %}">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
