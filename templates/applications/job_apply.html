{% extends 'base.html' %}
{% block title %}Apply | SmartRecruit AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="fw-bold mb-1">Apply to {{ job.title }}</h4>
                <p class="text-muted mb-4">{{ job.company.name }} &middot; {{ job.location }}</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ form.cover_note.label }}</label>
                        {{ form.cover_note }}
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Application</button>
                    <a href="{% url 'jobs:job_detail_public' job.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
